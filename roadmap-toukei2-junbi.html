var src="# 統計力学2のための最低限の問題ロードマップ\n\u003c!-- label: 統計力学2の準備 --\u003e\n\n作成日 2026-11-26。統計力学2（湯川『統計力学』第8〜12章：量子統計・理想フェルミ気体・理想ボース気体・実在気体・相転移と臨界現象）を学ぶ前に最低限解いておく問題を、統計力学1・熱物理学・量子力学2 の作成済みの演習教材から選び、解く順に並べた。\n\n## 選び方\n- 統計力学2 の教材の要点整理が前提にしている内容（$Z_N=Z_1^N/N!$、熱的ド・ブロイ波長と化学ポテンシャル、大分配関数と1粒子状態の占有数、状態密度、揺らぎと応答、キュリー則、光子、熱力学関数と相共存・van der Waals の臨界点）に絞った。\n- **数値の計算は避ける。** 数値を求める小問が一部だけの問題は、区分の欄に「数値の (4) は飛ばす」のように飛ばす小問を書いて入れた。数値の計算が主な問題は入れていない（付録）。\n- 作成時（2026-11-26）の学習記録で **S・A だった問題は外した**。B 以下の問題は復習として残してある。\n- 区分の **必須** は統計力学2 で直接使う内容、**発展** は時間に余裕があれば解く内容。全部で55問（必須39・発展16）。まず必須だけを段階の順に解く。\n- 「記録」の列は学習記録の最新の評価から自動で付く：☐ はまだ解いていない、☑ は習得（S・A・B）、↻ は要復習（C 以下）。段階の見出しの［済 x/y］は、その段階の習得した問題の数である。\n- 「問題N」は各章の PDF での今の問題番号（`/tsuika` で問題が増えると自動で付け直す）、「通し番号」は採点・学習記録で使う番号である。\n\n## 全体の流れ\n\n| 段階 | 内容 | 問題数（必須） | 主な教材 | 統計力学2 で使う章 |\n|---|---|:-:|---|---|\n| 1 | 熱力学の道具（偏微分・Legendre 変換・Maxwell の関係式・安定性） | 15（12） | 熱物理学 第3・10〜12章，統計力学1 第1章 | 全章 |\n| 2 | 状態の数え方と状態密度 | 4（3） | 統計力学1 第2・3章 | 第8〜10章 |\n| 3 | カノニカル分布とその応用 | 13（8） | 統計力学1 第4・5章 | 第8〜10・12章 |\n| 4 | グランドカノニカル分布 | 9（6） | 統計力学1 第6・7章 | 第8〜11章 |\n| 5 | 密度演算子と同種粒子 | 6（3） | 統計力学1 第13章，量子力学2 第10章 | 第8章 |\n| 6 | 相平衡と相転移（熱力学） | 8（7） | 熱物理学 第13・14章 | 第11・12章 |\n\n- 段階1〜5 はこの順に解く。段階6 は統計力学2 の第11章に入る前までに解けばよい。\n- 時間が無いときは、段階4（グランドカノニカル分布）の必須6問を最優先にする。\n\n## 段階1　熱力学の道具：偏微分・Legendre 変換・熱力学関数・Maxwell の関係式・安定性　15問（必須12） [済 2/15]\n\n統計力学2 では，分配関数から $F$・$J=-pV$・$\\mu$ を作り，比熱や等温圧縮率 $\\kappa_T$ を熱力学関数の2階微分として求める。何を固定した偏微分か，どの関数の自然な変数か，を迷わず扱えることが前提になる。安定性（$\\kappa_T\u003e0$）は第11章の気液共存（一様な相が不安定になる領域）で使う。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☑ B | 熱物理学 第3章 | 問題5 | #20 | 2 | 導出 | 全微分の代入による偏微分係数の変数変換 | **必須** |\n| ↻ C | 熱物理学 第3章 | 問題6 | #21 | 2 | 説明 | 何を固定した偏微分かの区別（循環関係の符号と，定圧・定積での温度微分の違い） | **必須** |\n| ↻ C | 熱物理学 第3章 | 問題2 | #17 | 1 | 計算 | 条件2による全微分の判定と，不定積分による原始関数の求め方（2変数・3変数） | 発展 |\n| ↻ C | 統計力学1 第1章 | 問題4 | #57 | 2 | 計算 | 基本関係式 $S(U,V,N)$ から示強変数・状態方程式を求め，ルジャンドル変換で $F$・$G$ を作ること，オイラーの関係式とギブス--デュエムの関係式 | **必須** |\n| ☑ B | 熱物理学 第10章 | 問題2 | #77 | 1 | 説明 | $U(T,V)$ が完全でないこと（自然な変数の組），化学的仕事と共役な変数の組，第8章のエネルギー方程式を使う | **必須** |\n| ☐ | 熱物理学 第10章 | 問題6 | #81 | 3 | 導出 | 内部エネルギーを $S$ について Legendre 変換して温度を変数とする関数を作ること，$x = -\\mathrm{d} g/\\mathrm{d} y$ と凸性の逆転，自然な変数の取り替え | **必須** |\n| ☐ | 熱物理学 第10章 | 問題7 | #133 | 3 | 導出 | Gibbs-Duhem の式から単位物質量当たりの量で $\\mathrm{d}\\mu = -s\\mathrm{d} T + v\\mathrm{d} p$ を導くこと，$(T,p)$ 面上の積分で $\\mu(T,p)$ の温度・圧力依存性を求めること，$\\mu$ が示強変数だけの関数であることと $T$・$p$・$\\mu$ の独立性 | **必須** |\n| ☐ | 熱物理学 第11章 | 問題1 | #83 | 1 | 計算 | $G(T,p,n)$ の偏微分，Gibbs-Helmholtz の公式と $C_{p}$ の公式，$G = \\mu n$，第8章の $(T,p)$ 表示の結果との整合 | **必須** |\n| ☐ | 熱物理学 第11章 | 問題2 | #84 | 1 | 計算 | $F(T,V,n)$ の偏微分，Gibbs-Helmholtz の公式と $C_{V}$ の公式，Euler の関係式，$F$ の凸性と $\\kappa_{T} \u003e 0$，第10章の Legendre 変換の結果を使う | **必須** |\n| ☐ | 熱物理学 第11章 | 問題4 | #86 | 2 | 説明 | 熱力学関数の2階微分と応答係数（$C_{V}$，$C_{p}$，$\\kappa_{T}$，$\\kappa_{S}$）の対応，凸性からの正値性 | **必須** |\n| ☐ | 熱物理学 第11章 | 問題5 | #87 | 2 | 計算 | $F(T,V,n)$ から状態方程式・エントロピー・内部エネルギー・定積比熱・化学ポテンシャルを求めること，Euler の関係式 | **必須** |\n| ☐ | 熱物理学 第11章 | 問題6 | #134 | 2 | 説明 | 等温過程で系から取り出せる仕事の上限が $-\\Delta F$ であること，等温・等積では $F$，等温・等圧では $G$ の減少で自発的な変化の向きが決まること，$U$・$H$ との違い（可逆なときに熱源とやり取りする熱 $T\\Delta S$ の分） | 発展 |\n| ☐ | 熱物理学 第12章 | 問題1 | #90 | 1 | 計算 | Maxwell の関係式の導出と，測定できる量（体膨張率）からのエントロピーの圧力依存性，第8章の水のデータを使う | **必須**・数値の (2)(3) は飛ばす |\n| ☐ | 熱物理学 第12章 | 問題7 | #95 | 3 | 導出 | 自由エネルギー最小による釣り合いの安定性の判定，$(\\partial p/\\partial V)_{T} \\le 0$ の意味，第11章の $F$ の凸性を使う | **必須**・数値の (4) は飛ばす |\n| ↻ C | 統計力学1 第1章 | 問題3 | #56 | 2 | 計算 | マクスウェルの関係式による $(\\partial U/\\partial V)_{T}$ の計算，状態方程式と熱容量からの内部エネルギー・エントロピーの組み立て，自由膨張での温度変化とエントロピーの増加 | 発展・数値の (4) は飛ばす |\n\n\n## 段階2　状態の数え方と状態密度　4問（必須3） [済 0/4]\n\n統計力学2 の各章は，箱の中の1粒子の準位と状態密度から始まる。境界条件と状態の数え方（#92），位相空間の体積と状態密度（#7），エネルギーが運動量に比例する場合（#63。光子気体・相対論的なボース気体）を押さえる。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ↻ C | 統計力学1 第3章 | 問題4 | #92 | 2 | 計算 | 境界条件（固定端と周期境界条件）による1粒子の準位と縮退の違い，量子数空間の全領域と象限での状態の数え方，巨視系ではエントロピーが境界条件によらないこと | **必須** |\n| ↻ C | 統計力学1 第3章 | 問題5 | #7 | 2 | 計算 | 位相空間体積を $h$ で割る古典的な状態の数え方，状態数 $\\Omega$ と状態密度 $g$（$\\Omega$ と $W$ が同じエントロピーを与える理由） | **必須**・数値の (5) は飛ばす |\n| ☐ | 統計力学1 第3章 | 問題14 | #63 | 4 | 導出 | エネルギーが運動量の大きさに比例する気体の状態数（運動量空間の体積），エントロピー・状態方程式・熱容量，断熱過程と比熱比 | **必須** |\n| ☐ | 統計力学1 第2章 | 問題1 | #97 | 1 | 計算 | 離散的な確率分布の期待値と分散，独立な2つの系の和の分布と，期待値・分散の加法性，独立でない場合の相関 | 発展 |\n\n\n## 段階3　カノニカル分布とその応用　13問（必須8） [済 0/13]\n\n$Z_N=Z_1^N/N!$，$F=-k_{\\mathrm B}T\\log Z_N$，エネルギーの揺らぎと熱容量（#68）は第8章の出発点。キュリー則（#20）は第9章のパウリ常磁性・第12章のイジング模型と比べる相手になる。電磁場を振動子の集まりとみる見方（#46）は第10章の光子気体に，揺らぎと応答の関係（#70）は第12章の「帯磁率と相関関数」に直結する。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 統計力学1 第4章 | 問題4 | #12 | 1 | 説明 | 等温系で $F$ を力学から直接求める利点，状態和で数える状態，$N!$ 因子の要否 | **必須** |\n| ☐ | 統計力学1 第4章 | 問題14 | #15 | 3 | 導出 | 系と熱浴の合成系からボルツマン因子 $\\mathrm{e}^{-\\beta\\mathcal{E}}$ が現れる仕組みと，熱浴のエントロピーの展開で高次項が無視できる理由 | **必須** |\n| ☐ | 統計力学1 第4章 | 問題7 | #68 | 1 | 計算 | 分配関数の対数の $\\beta$ 微分によるエネルギーの期待値と分散，エネルギーの揺らぎと熱容量の関係，相対的な揺らぎの $N$ 依存性 | **必須**・数値の (3) は飛ばす |\n| ☐ | 統計力学1 第4章 | 問題8 | #86 | 1 | 説明 | エネルギーの相対的な揺らぎの $N$ 依存性と，巨視系では分布の選び方によらず同じ熱力学が得られること，分散が負にならないことと熱力学的な安定性，揺らぎが無視できなくなる場合 | **必須** |\n| ☐ | 統計力学1 第4章 | 問題11 | #22 | 2 | 計算 | 一般化された等分配則とビリアル定理を，運動エネルギーやポテンシャルが2次式でない場合に使うこと | 発展 |\n| ☐ | 統計力学1 第4章 | 問題18 | #65 | 4 | 導出 | 分配関数が状態密度のラプラス変換であること，鞍点（最大値の周りの2次展開）による評価と自由エネルギー・エントロピーのルジャンドル変換の関係，補正が無視できる理由 | 発展 |\n| ☐ | 統計力学1 第5章 | 問題1 | #20 | 1 | 計算 | 独立な原子の分配関数から磁化を求めること，弱い磁場での線形応答（キュリー則）と強い磁場での飽和，スピンの大きさによる違い | **必須**・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第5章 | 問題20 | #47 | 3 | 導出 | 線型分散をもつ $d$ 次元の媒質での状態密度の数え方と，低温の比熱の温度依存性が空間の次元で決まること | **必須** |\n| ☐ | 統計力学1 第5章 | 問題22 | #46 | 3 | 導出 | 電磁場を調和振動子の集まりとして扱い，状態密度から黒体輻射のエネルギーと比熱を導いて，格子振動と比べる | **必須**・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第5章 | 問題23 | #70 | 4 | 導出 | 磁化の温度微分とエネルギー・磁化の相関（揺動応答関係の非対角成分），$F(T,B)$ のマクスウェルの関係式と断熱消磁での温度変化，結晶場があると冷却が止まる理由（第1章・第4章・第7章を使う） | **必須** |\n| ☐ | 統計力学1 第5章 | 問題9 | #13 | 2 | 計算 | 縮退のある準位をもつ系の分配関数（式\\noteshiki{5-8}）と，$F$ から $S$・$U$・熱容量を求めること，二準位系の熱容量の温度依存性 | 発展・数値の (5) は飛ばす |\n| ☐ | 統計力学1 第5章 | 問題21 | #73 | 3 | 導出 | デバイ模型（モードの総数による角振動数の上限），高温の Dulong–Petit の法則と低温の $T^{3}$ 則，デバイ温度を使った数値評価 | 発展・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第5章 | 問題2 | #31 | 1 | 計算 | 1原子の分配関数が並進と内部状態の積に分かれること，内部自由度が圧力に効かず化学ポテンシャル・熱容量・エントロピーに効くこと | 発展・数値の (4) は飛ばす |\n\n\n## 段階4　グランドカノニカル分布　9問（必須6） [済 0/9]\n\n量子統計の出発点で，**このロードマップで最も大事な段階**である。1粒子状態を部分系とみなした大分配関数（#37）から，ボース分布・フェルミ分布がそのまま出る。グランドポテンシャルと熱力学量（#33），粒子数の揺らぎと等温圧縮率（#90）は第9〜11章で繰り返し使う。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 統計力学1 第6章 | 問題1 | #29 | 1 | 説明 | 開放系での力学的状態1つの実現確率と，規格化因子に現れるグランドポテンシャル | **必須** |\n| ☐ | 統計力学1 第6章 | 問題2 | #30 | 1 | 計算 | カノニカル分配関数から大分配関数を作る方法と，独立な部分系の積に分ける方法 | **必須** |\n| ☐ | 統計力学1 第6章 | 問題3 | #32 | 2 | 計算 | 部分系の大分配関数の積と，複数個の粒子が入れる部分系での粒子数の期待値と揺らぎ | **必須** |\n| ☐ | 統計力学1 第6章 | 問題4 | #33 | 2 | 計算 | グランドポテンシャルと Gibbs 関係式から熱力学的量を求め，粒子数を固定した扱い（第3章）の結果と照合する | **必須**・数値の (5) は飛ばす |\n| ☐ | 統計力学1 第6章 | 問題7 | #37 | 3 | 導出 | 1粒子状態を部分系とみなした大分配関数と，占有数の上限が期待値・揺らぎに与える影響，古典的な極限 | **必須** |\n| ☐ | 統計力学1 第6章 | 問題5 | #90 | 2 | 計算 | 粒子数の揺らぎと等温圧縮率の関係（揺動応答関係とギブス--デュエムの関係式），巨視系での粒子数の相対的な揺らぎの大きさ，分子どうしの排除で揺らぎが小さくなること | **必須**・数値の (3)〜(5) は飛ばす |\n| ☐ | 統計力学1 第6章 | 問題9 | #96 | 3 | 計算 | 固相と気相の共存の条件（化学ポテンシャルが等しいこと）から蒸気圧を求めること，蒸気圧の温度依存性と昇華熱（エンタルピーの差），固体の原子の振動が蒸気圧と昇華熱に与える影響 | 発展・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第6章 | 問題8 | #38 | 3 | 導出 | 大分配関数を内部状態ごとの因子の積に分けること，内部状態ごとの原子数の分布がグランドカノニカル分布ではポアソン分布の積，カノニカル分布では二項分布になること | 発展・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第7章 | 問題5 | #26 | 3 | 導出 | T–P 分布での揺動応答関係（体積の揺らぎと等温圧縮率，エネルギーと体積の相関，$\\mathcal{E}+p\\mathcal{V}$ の揺らぎと定圧熱容量） | 発展 |\n\n\n## 段階5　密度演算子と同種粒子　6問（必須3） [済 0/6]\n\n$Z=\\operatorname{Tr}\\,\\mathrm{e}^{-\\beta\\hat H}$（#50）と，量子力学2 の同種粒子の対称化・状態の数え方（#94・#95）。第8章「粒子の統計性」の前に解く。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 統計力学1 第13章 | 問題3 | #50 | 1 | 計算 | カノニカル密度演算子の行列要素と $Z=\\operatorname{Tr}\\mathrm{e}^{-\\beta\\hat{H}}$，期待値 $\\operatorname{Tr}(\\hat{\\rho}\\hat{A})$ | **必須**・数値の (4) は飛ばす |\n| ☐ | 統計力学1 第13章 | 問題5 | #52 | 2 | 計算 | 対角化されていないハミルトニアンでの $Z=\\operatorname{Tr}\\mathrm{e}^{-\\beta\\hat{H}}$，別の基底での密度行列の非対角要素と実現確率 $c_{ll}$ | 発展 |\n| ☐ | 統計力学1 第13章 | 問題10 | #79 | 4 | 計算 | 自由粒子のカノニカル密度演算子の位置表示（運動量の固有状態で展開してガウス積分），非対角要素が熱的ド・ブロイ波長で減衰すること，量子効果が効く温度の目安 | 発展・数値の (4) は飛ばす |\n| ☐ | 量子力学2 第10章 | 問題2 | #94 | 1 | 計算 | 2粒子の対称化・反対称化と規格化，同じ状態を2つの粒子が占められるかどうか（パウリの原理） | **必須** |\n| ☐ | 量子力学2 第10章 | 問題3 | #95 | 1 | 計算 | 同種粒子の状態の数え方（区別できる粒子・ボーズ粒子・フェルミ粒子），同じ状態を占める確率の違い，3粒子以上で対称でも反対称でもない状態が残ること | **必須** |\n| ☐ | 量子力学2 第10章 | 問題8 | #100 | 3 | 導出 | 多数のフェルミ粒子の基底状態（フェルミエネルギー），粒子数への依存とパウリの原理による圧力 | 発展 |\n\n## 段階6　相平衡と相転移（熱力学）　8問（必須7） [済 0/8]\n\n第11章の気液共存・ファン・デル・ワールス気体と，第12章の相転移と臨界現象の準備。化学ポテンシャルが等しいことによる相共存（#102），共通接線と Maxwell の等面積則（#103・#107），van der Waals 方程式の臨界点の近くの展開（#110。平均場の臨界指数そのもの）を押さえる。統計力学2 の第11章に入る前に解けばよい。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 熱物理学 第13章 | 問題3 | #99 | 1 | 説明 | 相転移の次数による分類，$G$ の連続性とその凸性から決まるエントロピー・体積のとびの向き，相境界での化学ポテンシャルの一致，第11章の $G$ の凸性を使う | **必須** |\n| ☐ | 熱物理学 第13章 | 問題1 | #97 | 1 | 計算 | Clapeyron-Clausius の関係式による蒸気圧曲線の傾き，蒸発のエントロピー，蒸気の体積の理想気体近似 | **必須**・数値の (3) は飛ばす |\n| ☐ | 熱物理学 第13章 | 問題8 | #102 | 3 | 導出 | 化学ポテンシャルのモデルから蒸気圧曲線・潜熱・体積のとびを求め，Clapeyron-Clausius の関係式と共通接線を確かめること，第11章の $G = \\mu n$・$F = G - pV$ を使う | **必須** |\n| ☐ | 熱物理学 第13章 | 問題9 | #103 | 4 | 導出 | 定積の見方（$F(T,V)$ の共通接線）から Clapeyron-Clausius の関係式と潜熱の表式を導くこと，第11章の $F$ の偏微分と Euler の関係式を使う | **必須** |\n| ☐ | 熱物理学 第13章 | 問題4 | #106 | 1 | 説明 | Gibbs の相律の導出と，一成分系・二成分系への適用 | 発展 |\n| ☐ | 熱物理学 第14章 | 問題1 | #104 | 1 | 計算 | van der Waals 方程式の臨界点の導出と臨界圧縮因子，第12章の一様な状態が不安定になる温度との関係 | **必須**・数値の (2) は飛ばす |\n| ☐ | 熱物理学 第14章 | 問題3 | #107 | 2 | 計算 | Maxwell の等面積則の導出と，van der Waals 方程式の共存点の数値による確認 | **必須**・数値の (4) は飛ばす |\n| ☐ | 熱物理学 第14章 | 問題6 | #110 | 4 | 導出 | 臨界点の近くでの van der Waals 方程式の展開，共存相の幅と飽和蒸気圧の温度依存性，第13章の Clapeyron-Clausius の関係式による潜熱が臨界点で0になること | **必須**・数値の (4) は飛ばす |\n\n\n## 付録　数
