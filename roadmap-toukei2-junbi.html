function bar(ok,rv,n){var a=n?ok*100/n:0,b=n?rv*100/n:0;return '<div class="pbar"><i class="m" style="width:'+a.toFixed(2)+'%"></i><i class="v" style="width:'+b.toFixed(2)+'%"></i></div>'}

function nums(s,withReq){return '<div class="pnum"><span>'+fmt(S.ofTotal,'<b>'+s.ok+'</b>',s.n)+'</span>'+(s.rv?'<span class="rv">'+fmt(S.reviewN,'<b>'+s.rv+'</b>')+'</span>':'')+(withReq?'<span>'+fmt(S.reqProg,s.reqOk,s.req)+'</span>':'')+'</div>'}
var all=[],stages=M.stages||[];
stages.forEach(function(g){g.s=stat(g.rows||[]);all=all.concat(g.rows||[]);
 var s=g.s;g.state=(s.req?s.reqOk===s.req:s.ok===s.n)?'done':((s.ok+s.rv)>0?'active':'todo')});
var hasActive=stages.some(function(g){return g.state==='active'});
if(!hasActive){for(var i=0;i<stages.length;i++){if(stages[i].state!=='done'){stages[i].state='next';break}}}
var first=null;stages.forEach(function(g){if(!first&&(g.state==='active'||g.state==='next'))first=g});
var T=stat(all),allDone=stages.length&&stages.every(function(g){return g.state==='done'});
var lab={done:S.stDone,active:S.stActive,next:S.stNext,todo:S.stTodo};
// header
var h='<div class="row"><h1>'+esc(M.label||M.title)+'</h1><span class="date">'+esc(fmt(S.updated,M.updated))+'</span></div><nav class="nav"><a class="nb home" href="'+esc(M.top)+'">\u2190 '+esc(S.top)+'</a>';
(M.nav||[]).forEach(function(o){h+=o.cur?'<span class="nb cur" aria-current="page">'+esc(o.label)+'</span>':'<a class="nb" href="'+esc(o.href)+'">'+esc(o.label)+'</a>'});
d.getElementById('hd').innerHTML=h+'</nav>';
var nc=d.querySelector('.nav .cur');if(nc)nc.parentNode.scrollLeft=Math.max(0,nc.offsetLeft-60);
// summary
var c='<section class="card pad sum"><h2>'+esc(M.title)+'</h2>'+(M.intro?'<div class="lead">'+md(M.intro)+'</div>':'')+bar(T.ok,T.rv,T.n)+nums(T,true)
 +'<div class="lg"><i class="m"></i>'+esc(S.mastered)+' (S\u30fbA\u30fbB)<i class="v"></i>'+esc(S.review)+' (C\u30fbD\u30fbE)<i class="g"></i>'+esc(S.untouched)+'</div>'
 +'<div class="tools"><div class="seg" role="group"><button type="button" data-f="all">'+esc(S.filterAll)+'</button><button type="button" data-f="req">'+esc(S.filterReq)+'</button><button type="button" data-f="left">'+esc(S.filterLeft)+'</button></div>'
 +(first?'<a class="go" href="#s'+esc(first.no)+'">'+esc(S.toCurrent)+' \u2193</a>':'')+'</div></section>';
if((M.pre||[]).length){c+='<details class="card box"><summary>'+esc(S.about)+'</summary><div class="md">';M.pre.forEach(function(p){c+='<h2>'+mdi(p.title)+'</h2>'+md(p.body)});c+='</div></details>'}
// timeline
c+='<ol class="tl">';
stages.forEach(function(g,k){var s=g.s,st=g.state,rows=g.rows||[];
 var subj=[],chs={},pages={};rows.forEach(function(r){if(!chs[r.subj]){chs[r.subj]=[];subj.push(r.subj)}if(chs[r.subj].indexOf(r.ch)<0){chs[r.subj].push(r.ch);pages[r.subj+'-'+r.ch]=r.page}});
 var where=subj.map(function(x){return esc(x)+' '+esc(fmt(S.chapter,chs[x].slice().sort(function(a,b){return a-b}).join('\u30fb')))}).join('\uff0c');
 var chips='';subj.forEach(function(x){chs[x].slice().sort(function(a,b){return a-b}).forEach(function(y){var p=pages[x+'-'+y],t=esc(x)+' '+esc(fmt(S.chapter,y));chips+=p?'<a href="'+esc(p)+'">'+t+'</a>':'<span>'+t+'</span>'})});
 var list='';rows.forEach(function(r){
  list+='<div class="prob s-'+r.st+'" data-req="'+(r.req?1:0)+'"><div class="pm">'+(r.st==='none'?'<span class="pst">'+esc(S.notYet)+'</span>':'<span class="badge b'+esc(r.r)+'">'+esc(r.r)+'</span>')+'</div><div style="min-width:0"><div class="pt">'+mdi(r.title)+'</div>'
  +'<div class="pi"><span class="tag '+(r.req?'req':'opt')+'">'+esc(r.req?S.req:S.opt)+'</span><span>'+esc(r.subj)+' '+esc(fmt(S.chapter,r.ch))+'</span><span>'+esc(fmt(S.mondai,r.num))+'</span>'+(r.lv?'<span>'+esc(fmt(S.level,r.lv))+'</span>':'')+(r.kind?'<span>'+esc(r.kind)+'</span>':'')+'<span>#'+esc(r.ser)+'</span></div>'
  +(r.extra?'<div class="px">'+mdi(r.extra)+'</div>':'')
  +((r.note||r.page)?'<div class="pl">'+(r.note?'<a href="'+esc(r.note)+'">'+esc(S.note)+'</a>':'')+(r.page?'<a href="'+esc(r.page)+'">'+esc(S.record)+'</a>':'')+'</div>':'')+'</div></div>'});
 if(k>0)c+='<li class="arw" aria-hidden="true">\u2193</li>';
 c+='<li class="step '+st+'"><div class="node">'+(st==='done'?'\u2713':esc(g.no))+'</div><article class="card stage" id="s'+esc(g.no)+'"><div class="sh"><span class="sno">'+esc(fmt(S.step,g.no))+'</span><span class="sb '+st+'">'+(st==='done'?'\u2713 ':'')+esc(lab[st])+'</span></div>'
  +'<h3>'+mdi(g.name)+'</h3><div class="scnt">'+(g.count?esc(g.count)+'\u3000':'')+where+'</div>'+bar(s.ok,s.rv,s.n)+nums(s,true)
  +'<details><summary>'+esc(S.details)+'</summary><div class="sbody">'+(g.desc?'<h4>'+esc(S.why)+'</h4><div class="md">'+md(g.desc)+'</div>':'')
  +'<h4>'+esc(S.files)+'</h4><div class="chips">'+chips+'</div><h4>'+esc(S.problems)+'</h4><div class="plist">'+list+'</div><div class="emp hide">'+esc(S.empty)+'</div></div></details></article></li>'});
if(stages.length)c+='<li class="arw" aria-hidden="true">\u2193</li>';
c+='<li class="step goal'+(allDone?' done':'')+'"><div class="node">'+(allDone?'\u2713':'\u2691')+'</div><article class="card stage"><div class="sh"><span class="sb '+(allDone?'done':'next')+'">'+esc(S.goal)+'</span></div><h3>'+mdi(M.goal||M.title)+'</h3><div class="gtx">'+esc(allDone?S.goalDone:S.goalText)+'</div>'+bar(T.reqOk,0,T.req)+'<div class="pnum"><span>'+fmt(S.reqProg,'<b>'+T.reqOk+'</b>',T.req)+'</span></div></article></li></ol>';
(M.post||[]).forEach(function(p){c+='<details class="card box"><summary>'+mdi(p.title)+'</summary><div class="md">'+md(p.body)+'</div></details>'});
c+='<p class="ft">'+esc(fmt(S.updated,M.updated))+'</p>';
var main=d.getElementById('c');main.innerHTML=c;
// tables in Markdown: scroll on a PC, stacked cards on a phone
[].forEach.call(main.querySelectorAll('.md table'),function(t){var hs=[].map.call(t.querySelectorAll('thead th'),function(x){return x.textContent});
 [].forEach.call(t.querySelectorAll('tbody tr'),function(tr){[].forEach.call(tr.children,function(td,i){td.setAttribute('data-label',hs[i]||'')})});
 t.classList.add('stk');var w=d.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t)});
// filter (all / required / not yet mastered), remembered
var bs=[].slice.call(main.querySelectorAll('.seg button'));
function setF(f){main.setAttribute('data-f',f);bs.forEach(function(b){b.classList.toggle('on',b.getAttribute('data-f')===f)});
 [].forEach.call(main.querySelectorAll('.plist'),function(pl){var n=0;[].forEach.call(pl.children,function(p){var hid=(f==='req'&&p.getAttribute('data-req')==='0')||(f==='left'&&p.classList.contains('s-ok'));if(!hid)n++});pl.nextElementSibling.classList.toggle('hide',n>0)});
 try{localStorage.setItem('rmFilter',f)}catch(e){}}
bs.forEach(function(b){b.addEventListener('click',function(){setF(b.getAttribute('data-f'))})});
var f0='all';try{f0=localStorage.getItem('rmFilter')||'all'}catch(e){}setF(f0);
// #sN opens that step
function openHash(){var el=location.hash?d.getElementById(location.hash.slice(1)):null;if(el){var dt=el.querySelector('details');if(dt)dt.open=true;el.scrollIntoView()}}
window.addEventListener('hashchange',openHash);openHash();
if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([main]).catch(function(){})}
})();</script>
</body></html>
