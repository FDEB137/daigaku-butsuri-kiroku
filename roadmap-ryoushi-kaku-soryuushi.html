var src="# 原子核物理・素粒子物理のための量子力学 問題ロードマップ\n\n作成日 2026-11-26。量子力学1・2の作成済みの演習教材（本編）から、原子核物理学・素粒子物理学・素粒子原子核物理入門で使う量子力学に必要な問題を選び、解く順に並べた。\n\n## 選び方\n- **数値を計算する問題は入れていない。** 問題文に数値（`\\qty`・`\\num`）や「有効数字」の指定が1か所でもある問題は外した（核物理で特に大事なものは付録Aに挙げる）。\n- 作成時（2026-11-26）の学習記録で **S・A だった問題は外した**。B 以下の問題は復習として残してある。\n- 区分の **必須** は核・素粒子で直接使う内容、**発展** は時間に余裕があれば解く内容。全部で182問（必須140・発展42）。まず必須だけを段階の順に解き、発展は後から戻ればよい。\n- 「記録」の列は学習記録の最新の評価から自動で付く：☐ はまだ解いていない、☑ は習得（S・A・B）、↻ は要復習（C 以下）。段階の見出しの［済 x/y］は、その段階の習得した問題の数である。\n- 「問題N」は各章の PDF での今の問題番号（並び順。`/tsuika` で問題が増えると自動で付け直す）、「通し番号」は採点・学習記録で使う番号である。\n\n## 全体の流れ\n\n| 段階 | 内容 | 問題数（必須） | 主な教材 | 主に役立つ科目 |\n|---|---|:-:|---|---|\n| 0 | 土台の穴埋め | 33（26） | 量子力学1 第3〜7・10〜12・16〜18章 | 両方 |\n| 1 | 調和振動子の代数・正準量子化 | 13（10） | 量子力学1 第19〜21章 | 素粒子（場の量子化）・核（殻模型） |\n| 2 | 3次元・角運動量・スピン・合成・Wigner–Eckart の定理・アイソスピン | 41（31） | 量子力学1 第13〜15・24・25章 | 核（殻模型・重陽子・$J^\\pi$） |\n| 3 | 対称性・P・T・同種粒子・一般化された Pauli 原理 | 29（24） | 量子力学1 第23・26章，量子力学2 第10章 | 素粒子（保存則）・核（Pauli 原理・フェルミガス） |\n| 4 | ゲージ変換・2準位系 | 11（8） | 量子力学2 第1〜3章 | 素粒子（ゲージ原理・粒子の振動） |\n| 5 | 時間に依存しない摂動・変分 | 12（9） | 量子力学2 第4・5・12章 | 核（殻模型の補正） |\n| 6 | 時間に依存する摂動・黄金律 | 9（7） | 量子力学2 第7・8章 | 両方（崩壊率・選択則） |\n| 7 | WKB 法 | 4（2） | 量子力学2 第9章 | 核（α崩壊・核融合） |\n| 8 | 散乱理論 | 20（15） | 量子力学2 第13〜15章 | 両方 |\n| 9 | 第二量子化 | 10（8） | 量子力学2 第11章 | 素粒子（場の理論）・核（多体系） |\n\n- 段階0〜3 はこの順に解く。段階4・5 は段階3 の後ならどちらからでもよい。段階6 の後に段階7・8、段階1・3 の後に段階9 を解く。\n- 原子核物理学を先に固めたいときは 0→2→3→5→6→7→8、素粒子物理学を先に固めたいときは 0→1→2→3→4→6→8→9 の順でもよい。\n\n## 段階0　土台の穴埋め（量子力学1の既習範囲）　33問（必須26） [済 11/33]\n\nデルタ関数・パリティ・ブラケット・交換子・時間発展は、後の段階で毎回使う。学習記録で S・A の問題は外し、B 以下の問題（復習）とまだ解いていない要の問題だけを残した。時間とエネルギーの不確定性関係（#135）は崩壊幅と寿命の関係に、ユニタリ行列による対角化（#129）は混合行列（CKM・PMNS）につながる。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☑ B | 量子力学1 第3章 | 問題13 | #71 | 3 | 導出 | 期待値の時間変化と交換子，Ehrenfest の定理，ビリアル定理 | **必須** |\n| ☐ | 量子力学1 第3章 | 問題11 | #124 | 3 | 計算 | 3次元の確率流：球面波の確率流と，球面を通る全流量が半径によらないこと（連続の式とガウスの発散定理） | **必須** |\n| ↻ E | 量子力学1 第4章 | 問題4 | #32 | 2 | 導出 | 変数変換によるデルタ関数の性質，デルタ関数の微分 | **必須** |\n| ☐ | 量子力学1 第4章 | 問題8 | #23 | 3 | 導出 | デルタ関数の平面波展開を使ったフーリエ変換の性質（内積の保存・微分）と運動量の期待値 | **必須** |\n| ☐ | 量子力学1 第4章 | 問題9 | #24 | 3 | 計算 | ガウス型の波束のフーリエ変換と，位置の広がりと波数の広がりの関係 | 発展 |\n| ↻ C | 量子力学1 第5章 | 問題5 | #84 | 2 | 導出 | 段差とデルタ関数を含むポテンシャルでの接続条件の導出 | **必須** |\n| ☑ B | 量子力学1 第5章 | 問題8 | #139 | 2 | 計算 | パリティ演算子の定義と固有値，エルミート性，$\\hat{x}$・$\\hat{p}$ との関係，ハミルトニアンと交換する条件と期待値 | **必須** |\n| ☐ | 量子力学1 第5章 | 問題10 | #87 | 3 | 導出 | ロンスキアンによる束縛状態の非縮退の証明と，そこから導かれるパリティ | 発展 |\n| ☑ B | 量子力学1 第6章 | 問題3 | #92 | 2 | 導出 | 有限の深さの井戸の準位の方程式，図による束縛状態の数と存在条件，偶奇が交互に並ぶこと，波動関数の形と節の数 | **必須** |\n| ☐ | 量子力学1 第7章 | 問題9 | #97 | 3 | 導出 | デルタ関数ポテンシャルの透過振幅を複素数の波数に広げたときの極と，デルタ関数井戸の束縛状態との対応 | **必須** |\n| ☑ B | 量子力学1 第10章 | 問題1 | #26 | 1 | 計算 | エルミート行列の判定，固有値・規格化された固有ベクトル，複素ベクトルの直交 | **必須** |\n| ☐ | 量子力学1 第10章 | 問題13 | #44 | 3 | 計算 | 縮退した固有値に属する固有関数は自動的には直交しないことと，その直交化，別のエルミート演算子の固有値による区別 | 発展 |\n| ☐ | 量子力学1 第10章 | 問題14 | #129 | 3 | 計算 | エルミート行列の固有ベクトルを並べたユニタリ行列による対角化と，基底の変換で成分・内積・期待値・跡・行列式がどう変わるか | **必須** |\n| ↻ C | 量子力学1 第11章 | 問題8 | #54 | 3 | 導出 | フーリエ変換で $x$ と $\\partial^{2}/\\partial x^{2}$ が運動量表示でどう表されるかと，一様な力の場での運動量表示のエネルギー固有関数 | **必須** |\n| ☐ | 量子力学1 第11章 | 問題9 | #63 | 3 | 導出 | 運動量の2乗の期待値の座標表示（デルタ関数の積分表示による直接の導出）と，不連続な波動関数で運動エネルギーの期待値が発散すること | 発展 |\n| ☐ | 量子力学1 第12章 | 問題4 | #167 | 1 | 計算 | エルミート共役の定義と積の規則，指数関数型演算子のユニタリ性 | **必須** |\n| ☐ | 量子力学1 第12章 | 問題5 | #168 | 1 | 計算 | 交換子の代数と正準交換関係，量子 Poisson 括弧との対応 | **必須** |\n| ☑ B | 量子力学1 第12章 | 問題7 | #52 | 2 | 計算 | 交換子の帰納的な計算と演算子の指数関数を組み合わせた，並進の演算子による $\\hat{x}$ の変換 | **必須** |\n| ☐ | 量子力学1 第12章 | 問題8 | #172 | 2 | 導出 | 交換子が中心的な場合の BCH 公式の導出と演算子の順序の並べ替え | **必須** |\n| ☐ | 量子力学1 第12章 | 問題9 | #55 | 3 | 導出 | 交換しない演算子では指数法則 $\\exp(\\hat{A})\\exp(\\hat{B})=\\exp(\\hat{A}+\\hat{B})$ が成り立たないことと，その本質 | 発展 |\n| ☐ | 量子力学1 第12章 | 問題10 | #162 | 3 | 導出 | $[\\hat{x},f(\\hat{p})]=\\mathrm{i}\\hbar f'(\\hat{p})$・$[\\hat{p},g(\\hat{x})]=-\\mathrm{i}\\hbar g'(\\hat{x})$ と並進の演算子，交換子が数のときの指数関数の積の公式 | 発展 |\n| ☐ | 量子力学1 第16章 | 問題5 | #53 | 2 | 導出 | エルミート性と正準交換関係だけを使った，不確定性関係 $\\delta x\\,\\delta p\\ge\\hbar/2$ の証明 | **必須** |\n| ↻ C | 量子力学1 第16章 | 問題10 | #135 | 3 | 導出 | 時間とエネルギーの不確定性関係 $\\delta E\\,\\tau_{A}\\ge\\hbar/2$ の導出（この章の一般の不確定性関係を使う）と，自由粒子の波束・井戸の重ね合わせでの確認 | **必須** |\n| ☑ B | 量子力学1 第17章 | 問題2 | #66 | 1 | 計算 | 連続固有値の固有ケットによる行列要素とデルタ関数 | **必須** |\n| ☐ | 量子力学1 第17章 | 問題3 | #176 | 1 | 導出 | 平行移動演算子から位置表示での運動量演算子の作用を導く | **必須** |\n| ☐ | 量子力学1 第17章 | 問題5 | #178 | 1 | 導出 | 運動量を移動させる演算子から運動量表示での位置演算子の作用を導く | 発展 |\n| ☐ | 量子力学1 第17章 | 問題9 | #171 | 2 | 計算 | 平行移動演算子と運動量を移動させる演算子による，期待値と揺らぎの移動 | **必須** |\n| ☑ B | 量子力学1 第17章 | 問題10 | #72 | 3 | 導出 | 連続固有値のスペクトル分解と並進演算子 | **必須** |\n| ☑ B | 量子力学1 第17章 | 問題12 | #134 | 4 | 導出 | 運動量の固有ケットの完全性による時間発展の演算子の位置表示（自由粒子の伝播関数）と，その性質 | **必須** |\n| ☑ B | 量子力学1 第18章 | 問題1 | #73 | 1 | 計算 | 時間発展の演算子 $\\mathrm{e}^{-\\mathrm{i}\\hat{H}t/\\hbar}$ がシュレーディンガー方程式を解くことと，そのユニタリ性によるノルムの保存 | **必須** |\n| ☑ B | 量子力学1 第18章 | 問題2 | #74 | 1 | 計算 | ハイゼンベルク表示の運動方程式による自由粒子の $\\hat{x}_{\\mathrm{H}}(t)$，$\\hat{p}_{\\mathrm{H}}(t)$ と，異なる時刻の位置演算子の交換子 | **必須** |\n| ☐ | 量子力学1 第18章 | 問題5 | #191 | 2 | 導出 | あらわに時間を含む演算子のハイゼンベルク方程式による，調和振動子の時間を含む保存量 | **必須** |\n| ☑ B | 量子力学1 第18章 | 問題8 | #80 | 3 | 導出 | 2つの表示での期待値の一致と期待値の時間微分，時間をあらわに含む演算子の運動方程式と保存量（自由粒子・一様な力） | **必須** |\n\n## 段階1　調和振動子の代数と正準量子化　13問（必須10） [済 0/13]\n\n生成・消滅演算子の代数は、素粒子の場の量子化（場＝調和振動子の集まり）と、殻模型の振動子ポテンシャルの両方の土台である。$\\mathrm{e}^{sB}A\\mathrm{e}^{-sB}$ の公式（#170）は以後のユニタリ変換の計算で何度も使う。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学1 第20章 | 問題5 | #110 | 1 | 計算 | 生成消滅演算子による $\\hat{x}^{2}\\vert n\\rangle$ の展開と，$\\langle x^{2}\\rangle$・$\\langle x^{4}\\rangle$ の計算（位置表示の積分との照合） | **必須** |\n| ☐ | 量子力学1 第20章 | 問題6 | #103 | 2 | 計算 | 位置・運動量の行列要素と，固有状態での $\\langle \\hat{x}^{2}\\rangle$・$\\langle \\hat{p}^{2}\\rangle$・不確定さ | **必須** |\n| ☐ | 量子力学1 第20章 | 問題7 | #111 | 2 | 計算 | $\\hat{a}^{m}(\\hat{a}^{\\dagger})^{n}\\vert 0\\rangle$ の計算と，$\\vert n\\rangle$ の規格直交性 | 発展 |\n| ☐ | 量子力学1 第20章 | 問題11 | #106 | 3 | 導出 | 交換関係だけから調和振動子のエネルギー固有値と生成消滅演算子の作用を導くこと（零点エネルギー） | **必須** |\n| ☐ | 量子力学1 第20章 | 問題14 | #148 | 4 | 導出 | 一様な力を加えた調和振動子を生成消滅演算子のずらし $\\hat{b}=\\hat{a}-\\lambda$ で解くことと，新しい基底状態が平行移動した基底状態であること（第17章の並進演算子を使う） | **必須** |\n| ☐ | 量子力学1 第21章 | 問題1 | #151 | 1 | 計算 | コヒーレント状態の定義（消滅演算子の固有状態）から直接求める，数・エネルギー・位置・運動量の期待値と数の標準偏差 | **必須** |\n| ☐ | 量子力学1 第21章 | 問題2 | #104 | 2 | 計算 | 生成消滅演算子とハミルトニアンの交換子，ハイゼンベルク表示での調和振動子の運動 | **必須** |\n| ☐ | 量子力学1 第21章 | 問題3 | #170 | 2 | 計算 | $\\mathrm{e}^{sB}A\\mathrm{e}^{-sB}$ の微分方程式による評価と，数演算子の指数による位相空間の回転 | **必須** |\n| ☐ | 量子力学1 第21章 | 問題8 | #192 | 3 | 計算 | 時間に依存する外力を受ける調和振動子の ハイゼンベルク 演算子と励起 | 発展 |\n| ☐ | 量子力学1 第19章 | 問題1 | #258 | 1 | 計算 | Poisson 括弧の定義と運動方程式 $\\mathrm{d} A/\\mathrm{d} t=\\{A,H\\}_{\\mathrm{PB}}+\\partial A/\\partial t$，時刻をあらわに含む保存量 | **必須** |\n| ☐ | 量子力学1 第19章 | 問題3 | #260 | 1 | 計算 | 正準量子化で得る正準交換関係と，その位置表示・運動量表示での実現，$\\hbar$ の次元 | **必須** |\n| ☐ | 量子力学1 第19章 | 問題4 | #261 | 2 | 計算 | Poisson 括弧と交換子の対応 $[\\hat{A},\\hat{B}]\\leftrightarrow\\mathrm{i}\\hbar\\{A,B\\}_{\\mathrm{PB}}$ と，古典量の積を演算子にするときの順序（エルミートにする対称化） | **必須** |\n| ☐ | 量子力学1 第19章 | 問題8 | #265 | 3 | 導出 | Dirac の議論：Poisson 括弧と同じ性質を持つ量子 Poisson 括弧は交換子の $1/(\\mathrm{i}\\hbar)$ 倍に限られること，正準方程式とハイゼンベルクの運動方程式の対応（第12章・第18章を使う） | 発展 |\n\n## 段階2　3次元・角運動量・スピン・角運動量の合成　41問（必須31） [済 0/41]\n\n原子核の殻模型（3次元等方調和振動子の縮退〈#214〉→魔法数、スピン軌道相互作用による分岐〈#243〉）、基底状態の $J^\\pi$、重陽子（2体問題〈#193・#195〉と2つのスピンの合成〈#239・#240〉）はすべてここで決まる。2つのスピン1/2 の合成は、アイソスピン（陽子・中性子を同じ核子の2状態とみる）と同じ数学である。$2\\pi$ 回転で符号が変わること（#233）はスピノルの性質として素粒子でも使う。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学1 第13章 | 問題3 | #200 | 1 | 導出 | 軌道角運動量の定義と正準交換関係から，位置・運動量と角運動量の交換関係を導く | **必須** |\n| ☐ | 量子力学1 第13章 | 問題6 | #203 | 2 | 導出 | 位置・運動量と角運動量の交換関係から，軌道角運動量の成分の交換関係を導き，外積の形と同値であることを示す | **必須** |\n| ☐ | 量子力学1 第13章 | 問題4 | #210 | 1 | 計算 | 極座標での $\\hat L_z$ の表示と，磁気量子数が整数になること | **必須** |\n| ☐ | 量子力学1 第13章 | 問題8 | #207 | 3 | 導出 | 中心力のハミルトニアンと角運動量の可換性，磁気量子数についての縮退 | **必須** |\n| ☐ | 量子力学1 第13章 | 問題9 | #215 | 3 | 導出 | 角運動量の2乗と運動量の2乗の関 る行列要素の計算 | 発展 |\n| ☐ | 量子力学2 第10章 | 問題8 | #100 | 3 | 導出 | 多数のフェルミ粒子の基底状態（フェルミエネルギー），粒子数への依存とパウリの原理による圧力（量子力学1で使った剛体壁の井戸，第6章の断熱的な変化） | **必須** |\n| ☐ | 量子力学2 第10章 | 問題9 | #101 | 3 | 導出 | 2つの同種粒子の交換を相対座標の反転として表すこと，球面調和関数の偶奇性と合成スピンの対称性から許される $\\ell$ と $s$ の組（量子力学1の重心・相対座標，球面調和関数，スピンの合成を使う），オルト水素とパラ水素 | **必須** |\n| ☐ | 量子力学2 第10章 | 問題10 | #102 | 4 | 計算 | スピンによらない相互作用が交換対称性を通してスピンの向きに依存するエネルギーを生むこと（交換相互作用），一重項・三重項と $\\boldsymbol{\\sigma}_1\\cdot\\boldsymbol{\\sigma}_2$ の固有値（量子力学1の Pauli 行列とスピンの合成を使う） | 発展 |\n| ☐ | 量子力学2 第10章 | 問題11 | #103 | 4 | 導出 | 同じ大きさのスピン $j$ を2つ合成した状態の交換対称性と，等核2原子分子の核スピンの統計（量子力学1の角運動量の合成と，Level 3 のオルト水素・パラ水素の考え方を使う） | **必須** |\n| ☐ | 量子力学1 第25章 | 問題13 | #289 | 3 | 導出 | 一般化された Pauli 原理：2核子の空間・スピン・アイソスピンの入れ替えの対称性から $\\ell+S+T$ が奇数になることと，重陽子の量子数（同種粒子の考え方を使うので，量子力学2 第10章の後に解く） | **必須** |\n\n## 段階4　電磁場との結合・ゲージ変換・2準位系　11問（必須8） [済 0/11]\n\nゲージ変換で Schrödinger 方程式の形が変わらないこと（#148・#158）は、素粒子の相互作用を決める「ゲージ原理」の原型である。2準位系の時間発展と Rabi 振動（#29・#31）は、中性 K 中間子の振動・ニュートリノ振動と同じ形の計算になる。磁気単極子（#169）は電荷の量子化の議論として素粒子で出てくる。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第1章 | 問題1 | #147 | 1 | 導出 | 電磁場中の古典的な荷電粒子のラグランジアンから正準運動量・ハミルトニアンを導き，ゲージ変換でラグランジアンが時間の全微分だけ変わることを確かめる | **必須** |\n| ☐ | 量子力学2 第1章 | 問題2 | #148 | 1 | 計算 | 一様な磁場を与える2つのゲージと，それらを結ぶゲージ関数・波動関数の位相の変換 | **必須** |\n| ☐ | 量子力学2 第1章 | 問題3 | #149 | 1 | 計算 | 力学的運動量（速度の演算子）と，その成分どうしの交換関係が磁場を与えること | **必須** |\n| ☐ | 量子力学2 第1章 | 問題7 | #153 | 2 | 導出 | ベクトルポテンシャルがあるときの確率の流れと連続の式，そのゲージ不変性 | **必須** |\n| ☐ | 量子力学2 第1章 | 問題12 | #158 | 4 | 導出 | 時間に依存するゲージ変換でのシュレディンガー方程式の共変性と，ゲージで変わる量（正準運動量・ハミルトニアンの期待値）と変わらない量（力学的運動量） | **必須** |\n| ☐ | 量子力学2 第2章 | 問題4 | #162 | 2 | 導出 | Dirac の位相因子と，2つの経路の位相差が囲む磁束で決まること | **必須** |\n| ☐ | 量子力学2 第2章 | 問題6 | #164 | 2 | 導出 | 多価のゲージ関数で $\\boldsymbol{A}$ を消すと，磁束が境界条件のねじれに移ること（第1章のゲージ変換を使う） | 発展 |\n| ☐ | 量子力学2 第2章 | 問題11 | #169 | 4 | 導出 | 磁気単極子のベクトルポテンシャルの特異性と，波動関数の一価性による磁荷の量子化（AB 効果との関係） | 発展 |\n| ☐ | 量子力学2 第3章 | 問題1 | #29 | 1 | 計算 | 2準位系のハミルトニアンの対角化と時間発展演算子（行列の指数関数） | **必須** |\n| ☐ | 量子力学2 第3章 | 問題2 | #31 | 2 | 計算 | 2準位系の Heisenberg 表示と遷移確率（Rabi 振動） | **必須** |\n| ☐ | 量子力学2 第3章 | 問題6 | #39 | 4 | 導出 | 2準位系の Heisenberg 方程式を3次元ベクトルの歳差運動として解き，遷移確率を幾何学的に求める | 発展 |\n\n## 段階5　時間に依存しない摂動論・変分原理　12問（必須9） [済 0/12]\n\n縮退のある摂動論で「良い量子数」を選ぶ考え方（#116・#119）は、殻模型の残留相互作用や微細構造の扱いに必要である。数値を出す変分の問題は外し、変分原理そのもの（#134）だけを残した。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第4章 | 問題2 | #105 | 1 | 計算 | 生成・消滅演算子による行列要素の計算と，1次の補正の $n$ 依存性 | **必須** |\n| ☐ | 量子力学2 第4章 | 問題3 | #106 | 1 | 計算 | 2次のエネルギー補正と状態の1次の補正の公式，2次の補正の和 | **必須** |\n| ☐ | 量子力学2 第4章 | 問題5 | #108 | 2 | 計算 | 2準位系での摂動論と厳密解の比較，適用の条件と準位の反発（第3章の2準位系と量子力学1の Pauli 行列を使う） | **必須** |\n| ☐ | 量子力学2 第4章 | 問題7 | #110 | 3 | 導出 | 摂動展開の各次数の式から1次・2次の補正の公式を導くことと，規格化した状態での非摂動状態の重み | **必須** |\n| ☐ | 量子力学2 第4章 | 問題9 | #112 | 3 | 導出 | Hellmann–Feynman の定理と1次の摂動の関係，期待値の計算への応用（量子力学1の水素原子を使う） | **必須** |\n| ☐ | 量子力学2 第4章 | 問題8 | #111 | 3 | 計算 | 一様電場中の調和振動子での2次の補正と状態の1次の補正，分極率，厳密解との比較（量子力学1のコヒーレント状態を使う） | 発展 |\n| ☐ | 量子力学2 第5章 | 問題1 | #115 | 1 | 計算 | 縮退した2状態での永年方程式と正しい0次の状態，1次で分裂しない準位 | **必須** |\n| ☐ | 量子力学2 第5章 | 問題2 | #116 | 1 | 計算 | 良い量子数（全スピン）で正しい0次の状態が決まることと，1次の補正（量子力学1のスピンとスピンの合成を使う） | **必須** |\n| ☐ | 量子力学2 第5章 | 問題5 | #119 | 3 | 導出 | 縮退のある摂動論の永年方程式，可換な演算子で行列が対角になること，正しい0次の状態での2次の補正 | **必須** |\n| ☐ | 量子力学2 第5章 | 問題7 | #121 | 3 | 導出 | 縮退した2状態の分裂（エネルギーギャップ）と準縮退の2準位の扱い，縮退のない摂動論が使える条件 | 発展 |\n| ☐ | 量子力学2 第5章 | 問題9 | #123 | 4 | 導出 | 2つの摂動が同じ程度のときの縮退した部分空間の対角化，弱い磁場と強い磁場の極限，同じ $m_j$ の準位が交差しないこと（量子力学1のスピンと角運動量の合成を使う） | 発展 |\n| ☐ | 量子力学2 第12章 | 問題1 | #134 | 1 | 導出 | 変分原理（基底エネルギーの上界）と，基底状態に直交する状態による第1励起準位の上界，エネルギーの誤差が状態の誤差の2次になること | **必須** |\n\n## 段階6　時間に依存する摂動論・Fermi の黄金律　9問（必須7） [済 0/9]\n\n崩壊率・遷移率・散乱断面積はすべて黄金律（#130）と状態密度（#144）から出る。β崩壊・γ遷移の選択則（#125）、2次の Dyson 級数と中間状態（#132。Feynman 図の出発点）、断熱因子（#146。散乱理論の $+\\mathrm{i}\\epsilon$ の由来）を含む。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第7章 | 問題1 | #124 | 1 | 導出 | 状態の展開係数が従う厳密な方程式，確率の保存，1次の遷移振幅の公式 | **必須** |\n| ☐ | 量子力学2 第7章 | 問題2 | #125 | 1 | 計算 | 1次の遷移の選択則と，指数関数型のパルスによる遷移確率 | **必須** |\n| ☐ | 量子力学2 第7章 | 問題3 | #126 | 2 | 計算 | 一定の摂動を急に入れたときの遷移確率の時間変化と，第4章の状態の1次の補正との関係（第4章の時間に依存しない摂動論を使う） | **必須** |\n| ☐ | 量子力学2 第7章 | 問題7 | #131 | 3 | 導出 | 振動子の振動数の急な変化と突然近似，偶奇性による選択，変化後の状態がスクイーズド真空であること（量子力学1のスクイーズド真空を使う） | 発展 |\n| ☐ | 量子力学2 第7章 | 問題8 | #132 | 4 | 導出 | 2次の Dyson 級数と中間状態，2次までの確率の保存，外力を受ける振動子の厳密解との比較（量子力学1の外力を受ける振動子の厳密解を使う） | **必須** |\n| ☐ | 量子力学2 第8章 | 問題1 | #144 | 1 | 計算 | 自由粒子の状態密度（1次元・3次元）の数え方と，連続準位への遷移の式で遷移率が箱の大きさによらないこと | **必須** |\n| ☐ | 量子力学2 第8章 | 問題2 | #145 | 2 | 計算 | 偶奇による遷移先の制限，デルタ関数の井戸の奇の連続状態，振動する力による電離の遷移率とその振動数依存 | 発展 |\n| ☐ | 量子力学2 第8章 | 問題3 | #130 | 3 | 導出 | 調和的な摂動による共鳴，吸収と放出，連続的な終状態への和からフェルミの黄金律を導き，使える時間の範囲を考える（第7章の一定の摂動の問題の結果を使う） | **必須** |\n| ☐ | 量子力学2 第8章 | 問題4 | #146 | 4 | 導出 | 断熱因子で摂動をゆっくり入れたときの1次の振幅，時間に依存しない摂動論の状態の補正とエネルギーの補正の再現，極限の順序と連続準位への遷移の式 | **必須** |\n\n## 段階7　WKB 法　4問（必須2） [済 0/4]\n\nα崩壊・核融合（Coulomb 障壁のトンネル）を扱うための道具。Gamow 因子そのものの問題は数値の小問を含むので付録Aに回した。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第9章 | 問題1 | #170 | 1 | 導出 | $\\hbar$ のべきの展開から WKB 解を導き，振幅 $p^{-1/2}$ の意味を古典的な滞在時間と確率の流れで確かめること | **必須** |\n| ☐ | 量子力学2 第9章 | 問題8 | #177 | 3 | 導出 | 転回点の近くを Airy 関数で解いて接続公式を導き，両端の転回点で使って Bohr–Sommerfeld の条件と節の数を導くこと | **必須** |\n| ☐ | 量子力学2 第9章 | 問題3 | #172 | 1 | 計算 | 壁となめらかな転回点の間の量子化条件 $(n+3/4)\\pi\\hbar$ を使い，その端数の由来を接続公式で説明すること | 発展 |\n| ☐ | 量子力学2 第9章 | 問題11 | #180 | 4 | 導出 | 対称な二重井戸の準位の分裂を，片側の井戸の WKB 解の障壁の中での値から求め，第3章の2準位系として左右の行き来を調べること | 発展 |\n\n## 段階8　散乱理論　20問（必須15） [済 0/20]\n\n原子核物理・素粒子物理の実験はほぼすべて散乱である。Born 近似と形状因子（#198・#203）は電子散乱による原子核の大きさの測定に、部分波と共鳴（#215。Breit–Wigner の形）は核反応と共鳴粒子に、Lippmann–Schwinger 方程式・$T$ 行列・光学定理（#217・#223・#225）は素粒子の散乱振幅の言葉に直結する。段階6（黄金律）の後に解く。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第13章 | 問題1 | #192 | 1 | 計算 | 古典力学での微分断面積の定義と衝突径数 | **必須** |\n| ☐ | 量子力学2 第13章 | 問題5 | #196 | 2 | 計算 | 重心系と実験室系の散乱角と微分断面積の換算 | **必須** |\n| ☐ | 量子力学2 第13章 | 問題4 | #195 | 1 | 導出 | 外向きの Green 関数と境界条件 | **必須** |\n| ☐ | 量子力学2 第13章 | 問題9 | #200 | 3 | 導出 | 散乱状態の積分方程式と散乱振幅の積分表示から Born 近似を導くこと | **必須** |\n| ☐ | 量子力学2 第13章 | 問題8 | #199 | 2 | 導出 | 第8章のフェルミの黄金律から Born 近似の微分断面積を導くこと | **必須** |\n| ☐ | 量子力学2 第13章 | 問題7 | #198 | 2 | 計算 | 球形井戸型ポテンシャルの Born 近似と回折の極小 | **必須** |\n| ☐ | 量子力学2 第13章 | 問題12 | #203 | 4 | 計算 | 電荷分布による散乱と形状因子（電子と水素原子の弾性散乱） | **必須** |\n| ☐ | 量子力学2 第13章 | 問題10 | #201 | 3 | 計算 | 1次元の積分方程式の厳密解，Born 級数と束縛状態の極（第8章のデルタ関数の井戸を使う） | 発展 |\n| ☐ | 量子力学2 第13章 | 問題13 | #204 | 4 | 計算 | 2つの散乱中心からの散乱の干渉（2原子分子による散乱） | 発展 |\n| ☐ | 量子力学2 第14章 | 問題1 | #205 | 1 | 計算 | 自由な動径方程式の解（球 Bessel・Neumann・Hankel 関数）と漸近形 | **必須** |\n| ☐ | 量子力学2 第14章 | 問題7 | #211 | 3 | 導出 | Rayleigh の展開から散乱振幅の部分波展開・全断面積・光学定理を導くこと | **必須** |\n| ☐ | 量子力学2 第14章 | 問題10 | #214 | 4 | 導出 | 第13章の Born 振幅の部分波展開から位相のずれの Born 近似を導き，湯川型ポテンシャルに使うこと | **必須** |\n| ☐ | 量子力学2 第14章 | 問題11 | #215 | 4 | 計算 | デルタ関数の殻による s 波の共鳴（Breit–Wigner の幅と寿命，閉じ込められた状態の漏れ出し） | **必須** |\n| ☐ | 量子力学2 第14章 | 問題9 | #213 | 3 | 導出 | 高エネルギーの剛体球の全断面積 $2\\pi a^{2}$ と影の散乱 | 発展 |\n| ☐ | 量子力学2 第15章 | 問題8 | #223 | 3 | 導出 | $\\pm\\mathrm{i}\\epsilon$ の付け方と自由粒子の Green 関数，Lippmann–Schwinger 方程式から散乱振幅を得ること（第13章の Green 関数と積分方程式を使う） | **必須** |\n| ☐ | 量子力学2 第15章 | 問題2 | #217 | 1 | 計算 | Lippmann–Schwinger 方程式・遷移演算子 $T$・Born 級数（第13章の Born 近似を使う） | **必須** |\n| ☐ | 量子力学2 第15章 | 問題10 | #225 | 4 | 導出 | Lippmann–Schwinger 方程式と遷移演算子から光学定理を導くこと，Born 級数の2次との対応（第14章の光学定理） | **必須** |\n| ☐ | 量子力学2 第15章 | 問題3 | #218 | 1 | 計算 | 同種粒子の散乱振幅の対称化と，ボーズ粒子・フェルミ粒子・区別できる粒子の違い | **必須** |\n| ☐ | 量子力学2 第15章 | 問題7 | #222 | 3 | 導出 | 放物線座標による Coulomb 散乱の厳密解，対数の位相と Rutherford の公式（第13章の Born 近似と比べる） | 発展 |\n| ☐ | 量子力学2 第15章 | 問題11 | #226 | 4 | 導出 | 引力の Coulomb 散乱の振幅の極と水素型原子の準位・縮退（第14章の極と束縛状態の対応を使う） | 発展 |\n\n## 段階9　第二量子化　10問（必須8） [済 0/10]\n\n素粒子の場の理論と、原子核の多体系（平均場・粒子と空孔）の共通の言葉。段階1（調和振動子の代数）と段階3（同種粒子）を済ませてから解く。\n\n| 記録 | 教材 | 問題 | 通し番号 | Level | 種別 | 内容 | 区分 |\n|:-:|---|:-:|:-:|:-:|:-:|---|---|\n| ☐ | 量子力学2 第11章 | 問題1 | #182 | 1 | 計算 | ボーズ粒子の占有数状態と生成・消滅演算子の作用，全粒子数との交換関係 | **必須** |\n| ☐ | 量子力学2 第11章 | 問題2 | #183 | 1 | 計算 | フェルミ粒子の反交換関係と Pauli の排他律，占有数状態に作用させたときの符号 | **必須** |\n| ☐ | 量子力学2 第11章 | 問題3 | #184 | 1 | 導出 | 場の演算子の（反）交換関係，全粒子数の場の演算子による表示，1粒子状態の位置表示 | **必須** |\n| ☐ | 量子力学2 第11章 | 問題5 | #186 | 2 | 導出 | 占有数状態と第10章の対称化・反対称化した状態の対応（第10章の規格化 $N!\\,n_1!\\,n_2!\\cdots$ を使う） | **必須** |\n| ☐ | 量子力学2 第11章 | 問題4 | #185 | 2 | 計算 | 生成・消滅演算子の基底の取り替えによる1体のハミルトニアンの対角化（ボーズ粒子とフェルミ粒子） | **必須** |\n| ☐ | 量子力学2 第11章 | 問題6 | #187 | 2 | 計算 | 2体演算子の第二量子化した形，直接項と交換項（第4章の1次の摂動と第10章の反対称な波動関数を使う） | **必須** |\n| ☐ | 量子力学2 第11章 | 問題7 | #188 | 3 | 導出 | 場の演算子の Heisenberg の運動方程式（Schrödinger 方程式との対応）と，相互作用があるときの運動方程式 | **必須** |\n| ☐ | 量子力学2 第11章 | 問題8 | #189 | 3 | 計算 | 1次元のフェルミの海の1体密度行列と対相関（交換による穴。第10章のフェルミ粒子の波動関数の性質を使う） | 発展 |\n| ☐ | 量子力学2 第11章 | 問題10 | #191 | 4 | 導出 | 第二量子化した1体・2体の演算子が，位置の状態に $\\sum U(x_n)$，$\\sum v(x_n-x_{n'})$ として働くこと（第1量子化との同等性） | **必須** |\n| ☐ | 量子力学2 第11章 | 問題9 | #190 | 4 | 計算 | 相互作用のある2つの井戸のボーズ粒子の厳密な対角化と，第4章の摂動論（2次まで）との比較 | 発展 |\n\n## 付録A　数値の小問を含むが核物理で大事な問題\n数値の指定があるので上の表から外したが、内容は核物理の中心にある。数値を出す小問を飛ばし、文字式の部分だけ解く使い方ができる（入れるかどうかは任意）。\n\n| 教材 | 問題 | 通し番号 | 内容 | 関係する段階 |\n|---|:-:|:-:|---|---|\n| 量子力学1 第14章 | 問題1 | #211 | 動径方程式を $u=rR$ で1次元の形にし，遠心力ポテンシャルを見る | 2 |\n| 量子力学1 第14章 | 問題2 | #213 | 無限に深い球形の井戸の束縛状態（殻模型の出発点の一つ） | 2 |\n| 量子力学1 第15章 | 問題9 | #217 | 有限の深さの球形の井戸の $\\ell=0$ の束縛条件（重陽子） | 2 |\n| 量子力学1 第7章 | 問題13 | #146 | ゆるやかに変わる障壁の透過率の指数（Gamow 因子の原型） | 7 |\n| 量子力学2 第9章 | 問題10 | #179 | Coulomb 障壁の透過の指数（α崩壊の Gamow 因子） | 7 |\n| 量子力学2 第7章 | 問題6 | #129 | 原子核の電荷が急に変わるときの突然近似（β崩壊の後の原子） | 6 |\n| 量子力学2 第13章 | 問題2 | #193 | 確率の流れから微分断面積を散乱振幅で表す | 8 |\n| 量子力学2 第13章 | 問題6 | #197 | 湯川型ポテンシャルの Born 近似と Rutherford 散乱の極限 | 8 |\n| 量子力学2 第14章 | 問題2 | #206 | 位相のずれから部分波の振幅・全断面積を求める | 8 |\n| 量子力学2 第14章 | 問題5 | #209 | 球形井戸の s 波の位相のずれと散乱長 | 8 |\n| 量子力学2 第14章 | 問題8 | #212 | 散乱長と浅い束縛状態（重陽子と核子-核子散乱） | 8 |\n| 量子力学2 第15章 | 問題1 | #216 | Rutherford の公式と最接近距離 | 8 |\n| 量子力学2 第15章 | 問題6 | #221 | 同種粒子の Coulomb 散乱の干渉（Mott 散乱） | 8 |\n\n## 付録B　今の教材に無い内容\n- **アイソスピン**と **Wigner–Eckart の定理**は、2026-11-26 に量子力学1 第25章へ5問（#286〜#290）を足して段階2・3 に入れた。テンソル演算子は階数1（ベクトル演算子）だけを扱っている。電磁多重極遷移で使う一般の階数は、必要になったら足す。\n- **相対論的量子力学**（Klein–Gordon 方程式・Dirac 方程式）：素粒子物理学 第4回の演習で扱っている。量子力学2 の II 巻後半の章が決まったら、そちらで扱うかどうかを決める。\n\n## 進め方\n- 1日に解く量は段階ごとに区切るとよい。採点は今までどおり `/saiten 科目 章`、進み具合は `/shinchoku 量子力学1`・`/shinchoku 量子力学2` で確かめられる。\n- 「記録」の列と問題番号は `./tools/roadmap.ps1` で最新にでき、毎晩の自動採点（`kiroku.ps1 html`）でも更新される。スマホでは https://fdeb137.github.io/daigaku-butsuri-kiroku/roadmap-ryoushi-kaku-soryuushi.html で見られる（学習記録のページの上の「ロードマップ」からも開ける）。\n";
